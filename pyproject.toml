[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticpolicy"
version = "0.1.0"
description = "Safety guardrails for AI agents — add policy enforcement to LangChain, LlamaIndex and LangGraph agents in 30 lines of code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rahul", email = "rahulsagar280103@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "ai", "agents", "llm", "guardrails", "policy", "security",
    "langchain", "llamaindex", "langgraph", "authorization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
langchain = ["langchain>=0.1", "langchain-core>=0.1"]
llamaindex = ["llama-index-core>=0.10"]
langgraph = ["langgraph>=0.1"]
# Used by CI. Pinned to the majors the adapter tests exercise: LangChain 1.x
# replaced AgentExecutor with create_agent, and LlamaIndex 0.12 replaced
# ReActAgent.from_tools with a keyword constructor. The adapters handle both
# eras, but only the newer one can be tested without pinning backwards.
integrations = [
    "langchain>=1.0",
    "langchain-core>=0.3",
    "llama-index-core>=0.12",
    "langgraph>=0.2",
]

[project.urls]
Homepage = "https://github.com/4ahul/agenticpolicy-"
Documentation = "https://github.com/4ahul/agenticpolicy-/tree/main/docs"
"Bug Tracker" = "https://github.com/4ahul/agenticpolicy-/issues"

[project.scripts]
agenticpolicy = "agenticpolicy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenticpolicy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:agenticpolicy.*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
