name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Core imports no frameworks
        # The core must stay dependency-free; a stray convenience import at the
        # top of a module would break this without breaking any other test.
        run: |
          python -c "import sys, agenticpolicy; assert 'langchain' not in sys.modules"

      - name: Test
        run: pytest -q --cov=agenticpolicy --cov-report=term-missing

      - name: Examples still run
        run: |
          python examples/support_bot.py > /dev/null
          python examples/code_agent.py > /dev/null
          python examples/data_analyst.py > /dev/null

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with frameworks
        run: pip install -e ".[dev,integrations]"
      - name: Confirm the adapter tests actually ran
        # tests/test_adapters.py skips when a framework is missing. Without this
        # gate a broken extra would look like a green build.
        run: |
          python - <<'PY'
          import importlib.util, sys
          missing = [m for m in ("langchain_core", "langchain.agents", "langgraph",
                                 "llama_index.core")
                     if importlib.util.find_spec(m) is None]
          if missing:
              sys.exit(f"integrations extra did not install: {missing}")
          print("all frameworks present")
          PY
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: black --check src tests examples
      - run: mypy src
